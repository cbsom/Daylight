name: Release on successful build

on:
  workflow_run:
    workflows: ["CMake on multiple platforms"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: >
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'master'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Compute tag
        id: tag
        run: echo "value=v$(date +'%Y.%m.%d')-${{ github.event.workflow_run.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts from triggering run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: Release ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: |
            release-assets/**
