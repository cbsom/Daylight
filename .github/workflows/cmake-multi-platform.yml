name: CMake on multiple platforms

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.c_compiler }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            c_compiler: gcc
            cpp_compiler: g++
            qt_arch: gcc_64

          - os: ubuntu-24.04
            c_compiler: clang
            cpp_compiler: clang++
            qt_arch: gcc_64

          - os: windows-2022
            c_compiler: cl
            cpp_compiler: cl
            qt_arch: win64_msvc2022_64

    env:
      BUILD_TYPE: Release
      SOURCE_DIR: outputs/Earth-and-Sky/source

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang \
            libgl1-mesa-dev libglu1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt_arch }}
          cache: 'true'

      - name: Configure CMake on Linux
        if: runner.os == 'Linux'
        run: >
          cmake -S "${{ env.SOURCE_DIR }}" -B build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}

      - name: Configure CMake on Windows
        if: runner.os == 'Windows'
        run: >
          cmake -S "${{ env.SOURCE_DIR }}" -B build
          -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 2

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          ctest --test-dir build
          --build-config ${{ env.BUILD_TYPE }}
          --output-on-failure
